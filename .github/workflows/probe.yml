name: NarutoSenki 参数探针

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: ci-repo }
      - uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/

      - name: Generate + repair
        working-directory: src
        run: |
          python3 ci/gen_ios_proj.py . out
          python3 ci/repair_pbxproj.py .
          python3 ci/fix_proj.py .
          python3 ci/patch_ios.py .
          python3 ci/selftest.py .

      - name: PROBE
        working-directory: src
        run: |
          P="out/projects/NarutoSenki/proj.ios/NarutoSenki.xcodeproj"
          cd "out/projects/NarutoSenki/proj.ios"

          echo "############ A: -list ############"
          xcodebuild -project NarutoSenki.xcodeproj -list; echo "A_RC=$?"

          echo "############ B: -scheme ############"
          xcodebuild -project NarutoSenki.xcodeproj -scheme NarutoSenki -showBuildSettings 2>&1 | head -5; echo "B_RC=$?"

          echo "############ C: -target + -sdk ############"
          xcodebuild -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20; echo "C_RC=$?"

          echo "############ D: 加 -configuration ############"
          xcodebuild -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO 2>&1 | tail -10; echo "D_RC=$?"

          echo "############ E: 加 -arch arm64 ############"
          xcodebuild -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos -configuration Release -arch arm64 CODE_SIGNING_ALLOWED=NO 2>&1 | tail -10; echo "E_RC=$?"

          echo "############ F: 加 SYMROOT ############"
          xcodebuild -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos -configuration Release SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -10; echo "F_RC=$?"

          echo "############ G: 加 CONFIGURATION_BUILD_DIR ############"
          xcodebuild -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos -configuration Release CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -10; echo "G_RC=$?"
        continue-on-error: true

      - name: Summary
        if: always()
        run: echo "done" >> $GITHUB_STEP_SUMMARY
