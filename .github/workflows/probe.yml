name: NarutoSenki 参数探针

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: ci-repo }
      - uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/

      - name: Generate + repair
        working-directory: src
        run: |
          python3 ci/gen_ios_proj.py . out
          python3 ci/repair_pbxproj.py .
          python3 ci/fix_proj.py .
          python3 ci/patch_ios.py .
          python3 ci/selftest.py .

      - name: PROBE
        working-directory: src/out/projects/NarutoSenki/proj.ios
        run: |
          R="$GITHUB_WORKSPACE/report.txt"
          : > "$R"

          run() {
            name="$1"; shift
            echo "===== $name =====" >> "$R"
            echo "CMD: xcodebuild $*" >> "$R"
            xcodebuild "$@" > /tmp/o.txt 2>&1
            rc=$?
            echo "RC=$rc" >> "$R"
            echo "--- first 25 ---" >> "$R"
            head -25 /tmp/o.txt >> "$R"
            echo "--- last 15 ---" >> "$R"
            tail -15 /tmp/o.txt >> "$R"
            echo "" >> "$R"
          }

          run "A_list"    -project NarutoSenki.xcodeproj -list
          run "B_showSettings" -project NarutoSenki.xcodeproj -target NarutoSenki -showBuildSettings
          run "C_target_sdk" -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          run "D_conf"    -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO
          run "E_arch"    -project NarutoSenki.xcodeproj -target NarutoSenki -sdk iphoneos -configuration Release -arch arm64 CODE_SIGNING_ALLOWED=NO

          cp "$R" "$GITHUB_WORKSPACE/ci-repo/report.txt"
          echo "报告行数: $(wc -l < $R)"
        continue-on-error: true

      - name: Commit report
        if: always()
        run: |
          cd ci-repo
          git config user.name "ci-bot"
          git config user.email "ci@example.com"
          git add report.txt
          git commit -m "ci: probe report [skip ci]" || echo "no changes"
          git push || echo "push failed"
