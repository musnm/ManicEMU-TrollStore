name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: write

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Install python deps
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user openstep-parser 2>&1 | tail -3 || true
          python3 -c "import openstep_parser; print('openstep_parser OK')" || echo "不可用，跳过深度校验"

      - name: Inject CI scripts
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/
          cp ci-repo/ci/mk_ipa.sh src/ci/
          chmod +x src/ci/mk_ipa.sh

      - name: Generate & patch project
        working-directory: src
        run: |
          set -e
          python3 ci/gen_ios_proj.py . out
          python3 ci/repair_pbxproj.py .
          python3 ci/fix_proj.py .
          python3 ci/patch_ios.py .
          python3 ci/selftest.py

      - name: Build cocos2dx static lib
        working-directory: src
        run: |
          set -o pipefail
          LIB_OUT="$PWD/out/projects/NarutoSenki/proj.ios/libs"
          mkdir -p "$LIB_OUT"
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration "$CONFIG" \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/libs" \
            > "$GITHUB_WORKSPACE/cocos2dx.log" 2>&1 || {
              echo "===== cocos2dx 构建失败 ====="
              tail -80 "$GITHUB_WORKSPACE/cocos2dx.log"
              exit 1
            }
          find "$PWD/out/libs" -name "*.a" -exec cp -f {} "$LIB_OUT"/ \;
          ls -lh "$LIB_OUT"

      - name: Build game app
        working-directory: src
        run: |
          set -o pipefail
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          cd "$PROJ_DIR"
          # -Wl,-adhoc_codesign: 让 ld 生成 LC_CODE_SIGNATURE 槽位。
          # 不加的话可执行文件没有代码签名段，TrollStore 重签后无法注册
          # （trollstorehelper 报 Unable to register / returning 181）。
          xcodebuild \
            -project "$TARGET_NAME.xcodeproj" \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration "$CONFIG" \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -Wl,-adhoc_codesign' \
            SYMROOT="$PROJ_DIR/build" \
            > "$GITHUB_WORKSPACE/build-app.log" 2>&1 || {
              echo "===== 游戏构建失败 ====="
              grep -E "error:|fatal error|Undefined symbols|ld: |BUILD FAILED|clang: error" \
                "$GITHUB_WORKSPACE/build-app.log" | sort -u | head -60 || true
              echo "----- 末尾 60 行 -----"
              tail -60 "$GITHUB_WORKSPACE/build-app.log"
              exit 1
            }
          find "$PROJ_DIR/build" -name "*.app" -type d

      - name: Package & ad-hoc sign IPA
        id: pack
        working-directory: src
        run: |
          set -e
          APP=$(find out/projects/NarutoSenki/proj.ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "找不到 .app"; exit 1; fi
          echo "APP=$APP"
          sh ci/mk_ipa.sh "$APP" 2>&1 | tee "$GITHUB_WORKSPACE/pack.log"
          echo "sha256=$(shasum -a 256 "$TARGET_NAME.ipa" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NarutoSenki ${{ env.CONFIG }} build ${{ github.run_number }}
          files: src/NarutoSenki.ipa
          body: |
            TrollStore 可直装 IPA（ad-hoc 签名，含 LC_CODE_SIGNATURE）。

            - 配置：${{ env.CONFIG }}
            - 架构：arm64
            - 最低系统：iOS 12.0
            - SHA256：`${{ steps.pack.outputs.sha256 }}`

            安装：长按 ipa → 共享 → TrollStore → Install。

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-ipa
          path: src/NarutoSenki.ipa
          retention-days: 30

      - name: Diagnose on failure
        if: failure()
        run: |
          {
            echo "# 构建失败诊断 (run ${{ github.run_number }})"
            echo ""
            echo "## 打包"
            echo '```'
            [ -f pack.log ] && tail -60 pack.log || echo "(无)"
            echo '```'
            echo ""
            echo "## 游戏 target"
            echo '```'
            if [ -f build-app.log ]; then
              grep -vE "^ld: warning:" build-app.log \
                | grep -E "error:|fatal error|Undefined symbols|clang: error" \
                | sort -u | head -60 || tail -60 build-app.log
            else
              echo "(无日志)"
            fi
            echo '```'
            echo ""
            echo "## cocos2dx"
            echo '```'
            if [ -f cocos2dx.log ]; then
              grep -E "error:|BUILD FAILED" cocos2dx.log | sort -u | head -40 || tail -40 cocos2dx.log
            else
              echo "(无日志)"
            fi
            echo '```'
          } > ci-repo/BUILD_LOG.md
          cd ci-repo
          git config user.name bot
          git config user.email b@x
          git add BUILD_LOG.md
          git commit -m "ci: build failure log [skip ci]" || true
          git push || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-logs
          path: |
            build-app.log
            cocos2dx.log
            pack.log
          retention-days: 7
