name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: read

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Install python deps (best effort)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user openstep-parser 2>&1 | tail -3 || true
          python3 -c "import openstep_parser; print('openstep_parser OK')" || echo "不可用，将跳过语法校验"

      - name: Inject CI scripts
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/

      - name: Generate proj.ios
        working-directory: src
        run: python3 ci/gen_ios_proj.py . out

      - name: Repair pbxproj syntax
        working-directory: src
        run: python3 ci/repair_pbxproj.py .

      - name: Fixup pbxproj
        working-directory: src
        run: python3 ci/fix_proj.py .

      - name: Patch iOS specifics
        working-directory: src
        run: python3 ci/patch_ios.py .

      - name: Validate pbxproj
        working-directory: src
        run: python3 ci/selftest.py

      - name: Build cocos2dx static lib
        id: cocos2dx
        working-directory: src
        run: |
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration "$CONFIG" \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/libs" \
            > "$GITHUB_WORKSPACE/cocos2dx.log" 2>&1
          echo "cocos2dx 退出码: $?"
          find "$PWD/out/libs" -name "*.a" 2>/dev/null | head

      - name: Build game app
        id: game
        working-directory: src
        run: |
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          LIB_DIR="$PWD/out/libs/$CONFIG-iphoneos"
          ls -la "$LIB_DIR" 2>/dev/null || echo "(空)"

          cd "$PROJ_DIR"
          xcodebuild \
            -project "$TARGET_NAME.xcodeproj" \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration "$CONFIG" \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PROJ_DIR/build" \
            CONFIGURATION_BUILD_DIR="$PROJ_DIR/build/$CONFIG-iphoneos" \
            > "$GITHUB_WORKSPACE/build-app.log" 2>&1
          RC=$?
          echo "游戏退出码: $RC"
          echo "===== 错误 ====="
          grep -E "error:|fatal error|ld: |Undefined symbols|BUILD FAILED" \
            "$GITHUB_WORKSPACE/build-app.log" | sort -u | head -50 || true
          echo "===== 末尾 40 行 ====="
          tail -40 "$GITHUB_WORKSPACE/build-app.log"
          find "$PROJ_DIR/build" -name "*.app" -type d
          exit $RC

      - name: Package unsigned IPA
        id: pack
        run: |
          PROJ_DIR="src/out/projects/NarutoSenki/proj.ios"
          APP=$(find "$PROJ_DIR/build" -name "*.app" -type d -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then echo "找不到 .app"; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload "$TARGET_NAME-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$TARGET_NAME-unsigned.ipa" Payload
          ls -lh "$TARGET_NAME-unsigned.ipa"
          BIN=$(find Payload -maxdepth 2 -type f -perm -u+x | head -1)
          file "$BIN" || true
          lipo -info "$BIN" 2>/dev/null || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-ipa
          path: NarutoSenki-unsigned.ipa
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-logs
          path: |
            build-app.log
            cocos2dx.log
          retention-days: 7
