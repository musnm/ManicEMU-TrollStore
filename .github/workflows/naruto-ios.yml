name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: read

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject CI scripts
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/

      - name: Generate proj.ios
        working-directory: src
        run: python3 ci/gen_ios_proj.py . out

      - name: Patch iOS specifics
        working-directory: src
        run: python3 ci/patch_ios.py .

      - name: Validate pbxproj
        working-directory: src
        run: python3 ci/selftest.py

      # ---------- 诊断：列出工程里的 target ----------
      - name: Diagnose project
        working-directory: src
        run: |
          PROJ="out/projects/NarutoSenki/proj.ios/NarutoSenki.xcodeproj"
          echo "===== xcodebuild -list ====="
          xcodebuild -project "$PROJ" -list 2>&1 | head -60 || true
          echo
          echo "===== 工程目录 ====="
          ls -la out/projects/NarutoSenki/proj.ios/
          echo
          echo "===== 子工程引用 ====="
          grep -nE "cocos2dx.xcodeproj|CocosDenshion" "$PROJ/project.pbxproj" | head -20

      # ---------- 编译 cocos2dx 静态库 ----------
      - name: Build cocos2dx static lib
        id: cocos2dx
        working-directory: src
        continue-on-error: true
        run: |
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/libs" \
            > "$GITHUB_WORKSPACE/cocos2dx.log" 2>&1
          echo "退出码: $?"
          echo "===== 产出的 .a ====="
          find "$PWD/out/libs" -name "*.a" 2>/dev/null || true
          echo "===== 日志末尾 30 行 ====="
          tail -30 "$GITHUB_WORKSPACE/cocos2dx.log"

      # ---------- 编译游戏 App ----------
      - name: Build game app
        id: game
        working-directory: src
        run: |
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          cd "$PROJ_DIR"
          set +e
          xcodebuild \
            -project "$TARGET_NAME.xcodeproj" \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PROJ_DIR/build" \
            > "$GITHUB_WORKSPACE/build-app.log" 2>&1
          RC=$?

          echo "################ xcodebuild 退出码: $RC ################"
          echo
          echo "################ 完整日志（最后 250 行） ################"
          tail -250 "$GITHUB_WORKSPACE/build-app.log"
          echo
          echo "################ 错误行统计 ################"
          grep -cE "error:" "$GITHUB_WORKSPACE/build-app.log" 2>/dev/null || echo 0
          echo "################ 错误行（前 80 条） ################"
          grep -E "error:|fatal error|Undefined symbols|ld: |BUILD FAILED" "$GITHUB_WORKSPACE/build-app.log" \
            | sort -u | head -80 || true
          exit $RC

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-logs
          path: |
            build-app.log
            cocos2dx.log
          retention-days: 7
