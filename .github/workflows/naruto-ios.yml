name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: read

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject CI scripts
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/

      - name: Generate proj.ios
        working-directory: src
        run: python3 ci/gen_ios_proj.py . out

      - name: Fixup pbxproj
        working-directory: src
        run: python3 ci/fix_proj.py .

      - name: Patch iOS specifics
        working-directory: src
        run: python3 ci/patch_ios.py .

      - name: Validate pbxproj
        working-directory: src
        run: python3 ci/selftest.py

      - name: Build cocos2dx static lib
        id: cocos2dx
        working-directory: src
        continue-on-error: true
        run: |
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/libs" \
            > "$GITHUB_WORKSPACE/cocos2dx.log" 2>&1
          echo "退出码: $?"
          find "$PWD/out/libs" -name "*.a" 2>/dev/null
          tail -20 "$GITHUB_WORKSPACE/cocos2dx.log"

      # ---------- 编译游戏 ----------
      - name: Build game app
        id: game
        working-directory: src
        continue-on-error: true
        run: |
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          LIB_DIR="$PWD/out/libs/$CONFIG-iphoneos"
          echo "LIB_DIR=$LIB_DIR"
          ls -la "$LIB_DIR" 2>/dev/null || echo "(库目录为空)"

          cd "$PROJ_DIR"
          xcodebuild \
            -project "$TARGET_NAME.xcodeproj" \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            LIBRARY_SEARCH_PATHS="$LIB_DIR \$(inherited)" \
            CONFIGURATION_BUILD_DIR="$PROJ_DIR/build/$CONFIG-iphoneos" \
            SYMROOT="$PROJ_DIR/build" \
            > "$GITHUB_WORKSPACE/build-app.log" 2>&1
          RC=$?
          echo "xcodebuild 退出码: $RC"

          echo "===== 错误行 ====="
          grep -E "error:|fatal error|ld: |Undefined symbols|BUILD FAILED" \
            "$GITHUB_WORKSPACE/build-app.log" | sort -u | head -60 || true
          echo "===== 末尾 60 行 ====="
          tail -60 "$GITHUB_WORKSPACE/build-app.log"
          find "$PROJ_DIR/build" -name "*.app" -type d || true
          exit $RC

      # ---------- 无论如何把关键信息写进 Step Summary（无需认证即可读）----------
      - name: Push diagnostic summary
        if: always()
        run: |
          TITLE="NarutoSenki iOS — ${{ job.status }}"
          {
            echo "## $TITLE"
            echo ""
            echo "- cocos2dx 库: ${{ steps.cocos2dx.outcome }}"
            echo "- 游戏 App: ${{ steps.game.outcome }}"
            echo ""
            echo '### build-app.log 关键行'
            echo '```'
            grep -E "error:|fatal error|ld: |Undefined symbols|BUILD FAILED|not found" \
              build-app.log 2>/dev/null | sort -u | head -50 || echo "(无)"
            echo '```'
            echo '### build-app.log 末尾 100 行'
            echo '```'
            tail -100 build-app.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-logs
          path: |
            build-app.log
            cocos2dx.log
          retention-days: 7
