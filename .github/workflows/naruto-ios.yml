name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: read

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject CI scripts
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/*.py src/ci/

      - name: Generate proj.ios
        working-directory: src
        run: python3 ci/gen_ios_proj.py . out

      - name: Fixup pbxproj
        working-directory: src
        run: python3 ci/fix_proj.py .

      - name: Patch iOS specifics
        working-directory: src
        run: python3 ci/patch_ios.py .

      - name: Validate pbxproj
        working-directory: src
        run: python3 ci/selftest.py

      - name: Build cocos2dx static lib
        working-directory: src
        run: |
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration "$CONFIG" \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/libs" \
            > "$GITHUB_WORKSPACE/cocos2dx.log" 2>&1
          echo "cocos2dx 退出码: $?"
          find "$PWD/out/libs" -name "*.a" 2>/dev/null | head

      - name: Probe game project
        working-directory: src
        run: |
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          cd "$PROJ_DIR"
          LOG="$GITHUB_WORKSPACE/probe.log"

          xcodebuild -project "$TARGET_NAME.xcodeproj" -list > "$LOG" 2>&1
          echo "### -list 退出码: $?"
          head -30 "$LOG"

          echo "### 工程文件是否存在"
          ls -la "$TARGET_NAME.xcodeproj/"

          echo "### 最小参数编译"
          xcodebuild -project "$TARGET_NAME.xcodeproj" \
                     -target "$TARGET_NAME" \
                     -sdk iphoneos \
                     -configuration "$CONFIG" \
                     -arch arm64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ONLY_ACTIVE_ARCH=NO \
                     ENABLE_BITCODE=NO \
                     > "$LOG" 2>&1
          RC=$?
          echo "### 编译退出码: $RC"
          echo "########## 前 60 行 ##########"
          head -60 "$LOG"
          echo "########## 后 60 行 ##########"
          tail -60 "$LOG"
          echo "PROBE_RC=$RC" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "## NarutoSenki iOS"
            echo ""
            echo "PROBE_RC = ${{ env.PROBE_RC }}"
            echo ""
            echo '### probe.log（全部）'
            echo '```'
            cat probe.log 2>/dev/null | head -200 || echo "(无)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-logs
          path: |
            probe.log
            cocos2dx.log
          retention-days: 7
