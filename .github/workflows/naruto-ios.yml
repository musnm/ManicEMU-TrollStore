name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: read

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject CI scripts
        run: |
          ls -la ci-repo/ci/
          mkdir -p src/ci
          cp ci-repo/ci/gen_ios_proj.py src/ci/
          cp ci-repo/ci/patch_ios.py src/ci/
          cp ci-repo/ci/selftest.py src/ci/
          ls -la src/ci/
          ls src/projects/NarutoSenki/

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers
          uname -m

      - name: Generate proj.ios
        working-directory: src
        run: python3 ci/gen_ios_proj.py . out

      - name: Patch iOS specifics
        working-directory: src
        run: python3 ci/patch_ios.py .

      - name: Validate pbxproj
        working-directory: src
        run: python3 ci/selftest.py

      - name: Build cocos2dx static lib
        id: cocos2dx
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/build" \
            2>&1 | tee "$GITHUB_WORKSPACE/cocos2dx.log" | tail -150
          echo "=== 产出的 .a ==="
          find "$PWD/out/build" -name "*.a" -maxdepth 4 || true

      - name: Build game app
        id: game
        working-directory: src
        run: |
          set -o pipefail
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          cd "$PROJ_DIR"
          xcodebuild \
            -project "$TARGET_NAME.xcodeproj" \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PROJ_DIR/build/$CONFIG-iphoneos" \
            SYMROOT="$PROJ_DIR/build" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-app.log" | tail -200
          echo "=== 产出的 .app ==="
          find "$PROJ_DIR/build" -name "*.app" -type d || true

      - name: Package unsigned IPA
        run: |
          APP=$(find src/out/projects/NarutoSenki/proj.ios/build -name "*.app" -type d -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then echo "找不到 .app"; exit 1; fi
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$TARGET_NAME-unsigned.ipa" Payload
          ls -lh "$TARGET_NAME-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-ipa
          path: NarutoSenki-unsigned.ipa
          retention-days: 30

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          [ -f cocos2dx.log ] && cp cocos2dx.log logs/
          [ -f build-app.log ] && cp build-app.log logs/
          cp -f src/out/projects/NarutoSenki/proj.ios/NarutoSenki.xcodeproj/project.pbxproj logs/ 2>/dev/null || true
          grep -hE "error:|Error:|BUILD FAILED|Undefined symbols|fatal error" logs/*.log 2>/dev/null \
            | sort -u | head -400 > logs/errors.txt || true
          echo "错误行数: $(wc -l < logs/errors.txt 2>/dev/null || echo 0)"

      - name: Summary
        if: always()
        run: |
          echo "### NarutoSenki iOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| cocos2dx 静态库 | ${{ steps.cocos2dx.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 游戏 App | ${{ steps.game.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s logs/errors.txt ]; then
            echo "### 前 40 条错误" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -40 logs/errors.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-build-logs
          path: logs/
          retention-days: 7
