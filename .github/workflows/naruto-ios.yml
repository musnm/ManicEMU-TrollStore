name: NarutoSenki iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: read

env:
  TARGET_NAME: NarutoSenki
  CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Checkout upstream game source
        uses: actions/checkout@v4
        with:
          repository: LeaderOnePro/NarutoSenki-cocos2dx
          path: src
          fetch-depth: 1

      - name: Inject CI scripts
        run: |
          mkdir -p src/ci
          cp ci-repo/ci/gen_ios_proj.py src/ci/
          cp ci-repo/ci/patch_ios.py src/ci/
          cp ci-repo/ci/selftest.py src/ci/
          ls -la src/ci/

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate proj.ios
        working-directory: src
        run: python3 ci/gen_ios_proj.py . out

      - name: Patch iOS specifics
        working-directory: src
        run: python3 ci/patch_ios.py .

      - name: Validate pbxproj
        working-directory: src
        run: python3 ci/selftest.py

      - name: Build cocos2dx static lib
        id: cocos2dx
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project cocos2dx/proj.ios/cocos2dx.xcodeproj \
            -target cocos2dx \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/out/build" \
            2>&1 | tail -100

      # ---------- 编译游戏：不 tee，直接输出，让错误完整出现在日志里 ----------
      - name: Build game app
        id: game
        working-directory: src
        run: |
          PROJ_DIR="$PWD/out/projects/NarutoSenki/proj.ios"
          cd "$PROJ_DIR"
          set +e
          xcodebuild \
            -project "$TARGET_NAME.xcodeproj" \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration $CONFIG \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PROJ_DIR/build/$CONFIG-iphoneos" \
            SYMROOT="$PROJ_DIR/build" \
            > "$GITHUB_WORKSPACE/build-app.log" 2>&1
          RC=$?
          echo "xcodebuild 退出码: $RC"

          echo "======== 错误摘要（前 60 条） ========"
          grep -E "error:|fatal error|Undefined symbols|BUILD FAILED|ld: " "$GITHUB_WORKSPACE/build-app.log" \
            | sort -u | head -60 || echo "(无匹配错误行)"

          echo "======== 日志末尾 80 行 ========"
          tail -80 "$GITHUB_WORKSPACE/build-app.log"

          echo "======== 产出的 .app ========"
          find "$PROJ_DIR/build" -name "*.app" -type d || true

          exit $RC

      - name: Package unsigned IPA
        run: |
          APP=$(find src/out/projects/NarutoSenki/proj.ios/build -name "*.app" -type d -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then echo "找不到 .app"; exit 1; fi
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$TARGET_NAME-unsigned.ipa" Payload
          ls -lh "$TARGET_NAME-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-ipa
          path: NarutoSenki-unsigned.ipa
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-build-logs
          path: |
            build-app.log
            src/out/projects/NarutoSenki/proj.ios/NarutoSenki.xcodeproj/project.pbxproj
          retention-days: 7
